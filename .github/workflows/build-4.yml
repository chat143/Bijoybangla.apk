name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APKs (trial + paid)
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -v -E '^\s+at ' build.log | grep -E -A12 'What went wrong|^e: |FAILURE' | head -40 > err.txt
            echo "=================== আসল এরর (ERROR) ==================="
            cat err.txt
            echo "======================================================="
            msg=$(cat err.txt | head -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: BijoyKeyboard-trial-debug-apk
          path: build/outputs/apk/trial/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BijoyKeyboard-paid-debug-apk
          path: build/outputs/apk/paid/debug/*.apk
